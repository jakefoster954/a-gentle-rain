[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentle-rain"
version = "0.1.0"
description = "A simulation and playable UI for the tile-laying game 'A Gentle Rain'."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AGentleRain contributors" }]
dependencies = [
    "pygame>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
agentle-rain = "agentle_rain.__main__:main"
agentle-rain-editor = "agentle_rain.ui.editor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentle_rain = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["agentle_rain"]
